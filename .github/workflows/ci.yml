name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      # The checks drive a real browser against the built bundle, so the browser
      # has to be present. --with-deps pulls the system libraries the runner lacks.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run checks
        run: npm test
